<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Birthday Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();
        function getUserId() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user.id;
            return new URLSearchParams(window.location.search).get('user_id') || 0;
        }
        function apiUrl(path) {
            return path + (path.includes('?') ? '&' : '?') + 'user_id=' + getUserId();
        }
        const headers = { 'Content-Type': 'application/json' };
    </script>

    <div class="max-w-lg mx-auto p-4">
        <!-- Header -->
        <div class="flex items-center mb-6">
            <a href="/" class="text-blue-600 mr-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
        </div>

        <!-- Tabs -->
        <div class="flex space-x-1 bg-gray-200 rounded-lg p-1 mb-6">
            <button onclick="showTab('stats')" id="tab-stats" class="flex-1 py-2 text-xs font-medium rounded-md bg-white shadow text-gray-800">Stats</button>
            <button onclick="showTab('birthdays')" id="tab-birthdays" class="flex-1 py-2 text-xs font-medium rounded-md text-gray-600">Birthdays</button>
            <button onclick="showTab('calendar')" id="tab-calendar" class="flex-1 py-2 text-xs font-medium rounded-md text-gray-600">Calendar</button>
            <button onclick="showTab('ads')" id="tab-ads" class="flex-1 py-2 text-xs font-medium rounded-md text-gray-600">Ads</button>
        </div>

        <!-- Stats Tab -->
        <div id="panel-stats">
            <div id="statsContent" class="space-y-4"></div>
        </div>

        <!-- Birthdays Tab -->
        <div id="panel-birthdays" style="display:none;">
            <div class="mb-3">
                <a id="exportLink" class="text-blue-600 text-sm hover:underline cursor-pointer">Export all to CSV</a>
            </div>
            <div id="birthdayList" class="space-y-3"></div>
        </div>

        <!-- Calendar Tab -->
        <div id="panel-calendar" style="display:none;">
            <div class="flex items-center justify-between mb-4">
                <button onclick="changeMonth(-1)" class="bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">&lt;</button>
                <span id="calendarTitle" class="font-semibold text-gray-800"></span>
                <button onclick="changeMonth(1)" class="bg-gray-200 px-3 py-1 rounded-lg hover:bg-gray-300">&gt;</button>
            </div>
            <div id="calendarGrid"></div>
        </div>

        <!-- Ads Tab -->
        <div id="panel-ads" style="display:none;">
            <div class="bg-white rounded-xl shadow-md p-5 space-y-4">
                <h2 class="text-lg font-semibold text-gray-800">Create Advertisement</h2>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Message *</label>
                    <textarea id="adMessage" rows="4" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Write advertisement message..."></textarea>
                </div>

                <!-- Confirmation -->
                <div id="adConfirm" style="display:none;" class="bg-yellow-50 border border-yellow-200 rounded-lg p-3">
                    <p class="text-sm font-medium text-yellow-800 mb-2">Confirm ad message:</p>
                    <p id="adPreview" class="text-sm text-gray-700"></p>
                    <div class="flex space-x-2 mt-3">
                        <button onclick="confirmAd()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm">Confirm &amp; Send</button>
                        <button onclick="cancelAd()" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 text-sm">Cancel</button>
                    </div>
                </div>

                <button onclick="prepareAd()" id="adBtn" class="w-full bg-purple-600 text-white py-2.5 rounded-lg hover:bg-purple-700 font-medium">Create &amp; Send Ad</button>
            </div>
        </div>
    </div>

    <script>
        let currentMonth = new Date().getMonth() + 1;
        let currentYear = new Date().getFullYear();

        function showTab(tab) {
            ['stats', 'birthdays', 'calendar', 'ads'].forEach(t => {
                document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
                const btn = document.getElementById('tab-' + t);
                if (t === tab) { btn.classList.add('bg-white', 'shadow', 'text-gray-800'); btn.classList.remove('text-gray-600'); }
                else { btn.classList.remove('bg-white', 'shadow', 'text-gray-800'); btn.classList.add('text-gray-600'); }
            });
            if (tab === 'stats') loadStats();
            if (tab === 'birthdays') loadBirthdays();
            if (tab === 'calendar') loadCalendar();
        }

        async function loadStats() {
            const resp = await fetch(apiUrl('/api/admin/stats'));
            if (!resp.ok) { document.getElementById('statsContent').innerHTML = '<p class="text-red-500">Access denied</p>'; return; }
            const s = await resp.json();
            document.getElementById('statsContent').innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-5">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">System Statistics</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-purple-50 rounded-lg p-3 text-center">
                            <p class="text-2xl font-bold text-purple-600">${s.total_users}</p>
                            <p class="text-xs text-gray-500">Total Users</p>
                        </div>
                        <div class="bg-blue-50 rounded-lg p-3 text-center">
                            <p class="text-2xl font-bold text-blue-600">${s.total_birthdays}</p>
                            <p class="text-xs text-gray-500">Total Birthdays</p>
                        </div>
                        <div class="bg-red-50 rounded-lg p-3 text-center">
                            <p class="text-2xl font-bold text-red-600">${s.gifts_needed}</p>
                            <p class="text-xs text-gray-500">Gifts Needed</p>
                        </div>
                    </div>
                    ${s.nearest ? `
                    <div class="mt-4 bg-green-50 rounded-lg p-3">
                        <p class="text-sm font-medium text-green-800">Nearest Birthday</p>
                        <p class="text-sm text-gray-700">${esc(s.nearest.full_name)} - ${s.nearest_date}</p>
                    </div>` : ''}
                    ${s.nearest_gift ? `
                    <div class="mt-3 bg-yellow-50 rounded-lg p-3">
                        <p class="text-sm font-medium text-yellow-800">Nearest Birthday (Gift)</p>
                        <p class="text-sm text-gray-700">${esc(s.nearest_gift.full_name)} - ${s.nearest_gift_date}</p>
                    </div>` : ''}
                </div>
            `;
        }

        async function loadBirthdays() {
            const resp = await fetch(apiUrl('/api/admin/birthdays'));
            if (!resp.ok) return;
            const data = await resp.json();
            const container = document.getElementById('birthdayList');
            if (!data.length) { container.innerHTML = '<p class="text-gray-500 text-center py-8">No birthdays in the system.</p>'; return; }
            container.innerHTML = data.map(b => `
                <div class="bg-white rounded-xl shadow-md p-4">
                    <h3 class="font-semibold text-gray-800">${esc(b.full_name)}</h3>
                    <p class="text-sm text-gray-500">${b.date_of_birth} &middot; ${esc(b.relationship)} &middot; User: ${b.user_id}</p>
                    ${b.gift_required ? '<span class="inline-block mt-1 text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">Gift needed</span>' : ''}
                </div>
            `).join('');
        }

        async function loadCalendar() {
            const resp = await fetch(apiUrl('/api/admin/calendar') + '&month=' + currentMonth + '&year=' + currentYear);
            if (!resp.ok) return;
            const cal = await resp.json();
            document.getElementById('calendarTitle').textContent = cal.month_name + ' ' + cal.year;
            const bdayMap = {};
            cal.birthdays.forEach(b => { if (!bdayMap[b.day]) bdayMap[b.day] = []; bdayMap[b.day].push(b); });
            let html = '<div class="grid grid-cols-7 gap-1 text-center text-xs font-medium text-gray-500 mb-1">';
            ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(d => html += '<div>' + d + '</div>');
            html += '</div><div class="grid grid-cols-7 gap-1">';
            cal.weeks.forEach(week => {
                week.forEach(day => {
                    if (day === 0) { html += '<div class="p-2"></div>'; }
                    else {
                        const has = bdayMap[day];
                        html += '<div class="p-2 rounded-lg text-sm ' + (has ? 'bg-blue-100 text-blue-800 font-bold' : 'text-gray-700') + '">';
                        html += day;
                        if (has) has.forEach(b => html += '<div class="text-xs truncate">' + esc(b.full_name) + '</div>');
                        html += '</div>';
                    }
                });
            });
            html += '</div>';
            document.getElementById('calendarGrid').innerHTML = html;
        }

        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            loadCalendar();
        }

        function prepareAd() {
            const msg = document.getElementById('adMessage').value.trim();
            if (!msg) { alert('Please enter a message'); return; }
            document.getElementById('adPreview').textContent = msg;
            document.getElementById('adConfirm').style.display = 'block';
            document.getElementById('adBtn').style.display = 'none';
        }

        function cancelAd() {
            document.getElementById('adConfirm').style.display = 'none';
            document.getElementById('adBtn').style.display = 'block';
        }

        async function confirmAd() {
            const msg = document.getElementById('adMessage').value.trim();
            const resp = await fetch(apiUrl('/api/admin/ads'), { method: 'POST', headers, body: JSON.stringify({ message: msg }) });
            if (resp.ok) {
                alert('Advertisement created and will be sent to all users!');
                document.getElementById('adMessage').value = '';
                cancelAd();
            } else {
                alert('Failed to create advertisement');
            }
        }

        function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

        document.getElementById('exportLink').href = apiUrl('/api/admin/export');
        loadStats();
    </script>
</body>
</html>
