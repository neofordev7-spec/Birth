<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.ready();
        function getUserId() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user.id;
            return new URLSearchParams(window.location.search).get('user_id') || 0;
        }
    </script>

    <div class="max-w-lg mx-auto p-4">
        <div class="text-center mb-8 pt-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Birthday Bot</h1>
            <p class="text-gray-500">Manage birthdays &amp; never forget to congratulate</p>
        </div>

        <div class="space-y-4">
            <a href="/birthdays" class="block bg-white rounded-xl shadow-md p-5 hover:shadow-lg transition">
                <div class="flex items-center">
                    <div class="bg-blue-100 rounded-full p-3 mr-4">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-semibold text-gray-800">Birthdays</h2>
                        <p class="text-sm text-gray-500">Add, edit, and manage birthdays</p>
                    </div>
                </div>
            </a>

            <a href="/congrats" class="block bg-white rounded-xl shadow-md p-5 hover:shadow-lg transition">
                <div class="flex items-center">
                    <div class="bg-green-100 rounded-full p-3 mr-4">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-semibold text-gray-800">Congratulation Texts</h2>
                        <p class="text-sm text-gray-500">Create and manage templates</p>
                    </div>
                </div>
            </a>

            <a href="/admin" class="block bg-white rounded-xl shadow-md p-5 hover:shadow-lg transition" id="adminLink" style="display:none;">
                <div class="flex items-center">
                    <div class="bg-purple-100 rounded-full p-3 mr-4">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                        </svg>
                    </div>
                    <div>
                        <h2 class="text-lg font-semibold text-gray-800">Admin Panel</h2>
                        <p class="text-sm text-gray-500">Analytics, management &amp; ads</p>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const uid = getUserId();
            if (!uid) return;
            try {
                const resp = await fetch('/api/admin/stats?user_id=' + uid);
                if (resp.ok) document.getElementById('adminLink').style.display = 'block';
            } catch(e) {}
        }
        checkAdmin();
    </script>
</body>
</html>
